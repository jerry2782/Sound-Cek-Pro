
name: Build SOUND CHECK PRO APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the GitHub runner Android SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Extract Android project
        run: |
          echo "Daftar file ZIP di repository:"
          find . -maxdepth 2 -type f -iname '*.zip'
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan"
            exit 1
          fi
          echo "Menggunakan: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          find extracted -name settings.gradle.kts

      
      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Folder project Android tidak ditemukan"
            exit 1
          fi
          echo "Project ditemukan: $PROJECT_DIR"
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOUND-CHECK-PRO-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOUND-CHECK-PRO-APK
          path: extracted/SOUND_CHECK_PRO_V3_ACTIVE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
